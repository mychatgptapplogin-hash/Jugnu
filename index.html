<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jugnu Munshi</title>
<meta name="theme-color" content="#0B5D45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Sora:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: a shop register. Maroon cloth cover bar on top, cream ruled "pages" below, one column on phones.
   Deliberately one light "paper" look, so every colour is set explicitly. */
:root{
  --desk:#EFE6D2; --paper:#FFFBF0; --rule:#E6D9BC; --margin:#C0392B; --ink:#1F1A17; --ink2:#4A3F36;
  --cover:#5E1A1A; --cover2:#7A2424; --gold:#E2B04A; --goldsoft:#F6DFA6;
  --udhaar:#A61E14; --wasooli:#17643A; --amber:#C46A0C; --line:#D8C9A6;
  --latin:'Sora', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --urdu:'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif;
  --pashto:'Noto Naskh Arabic', 'Segoe UI', serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--latin);font-size:16px;line-height:1.45;padding-inline:16px}
html[lang="ur"] body{font-family:var(--urdu),var(--latin);font-size:17px;line-height:2.05}
html[lang="ps"] body{font-family:var(--pashto),var(--latin);font-size:17px;line-height:1.75}
.num,.amt,input[inputmode="numeric"],input[type="date"]{font-family:var(--latin);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:560px;margin:0 auto;padding-block:0 120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:10px 16px;background:linear-gradient(180deg,var(--cover2),var(--cover));color:#FFF6E3;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 0 var(--gold)}
.logo{display:flex;align-items:flex-start;gap:2px;font-family:var(--latin);font-weight:700;font-size:23px;letter-spacing:-.04em;background:none;border:none;color:#FFF6E3;cursor:pointer;padding:0}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px 4px rgba(226,176,74,.6);margin-top:4px;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.6}20%{opacity:1}35%{opacity:.7}50%{opacity:1}}
.logo small{font-size:12px;font-weight:600;color:var(--goldsoft);letter-spacing:.08em;text-transform:uppercase;margin:9px 8px 0}
.hbtns{display:flex;gap:8px}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,230,180,.35);background:rgba(0,0,0,.18);color:#FFF6E3;display:grid;place-items:center;cursor:pointer}
main{padding-top:14px}
.page{background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 0 #fff inset,0 6px 18px rgba(80,50,10,.10);padding:16px;position:relative}
.page.ruled{background-image:linear-gradient(var(--paper),var(--paper)),repeating-linear-gradient(transparent 0 39px,var(--rule) 39px 40px)}
h1{font-size:22px;margin:0;line-height:1.5}
html[lang="ur"] h1{font-size:24px;line-height:2}
h2{font-size:16px;margin:18px 0 8px;color:var(--cover);letter-spacing:.02em}
html[lang="ur"] h2,html[lang="ps"] h2{font-size:18px}
p{margin:0}
.soft{color:var(--ink2)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.shopname{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2px solid var(--cover);padding-bottom:8px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
.tile{padding:10px 10px;border-inline-start:1px solid var(--line)}
.tile:first-child{border-inline-start:none}
.tile small{display:block;font-size:13px;color:var(--ink2);line-height:1.6}
.tile b{font-size:19px;letter-spacing:-.02em;display:block}
.u{color:var(--udhaar)} .w{color:var(--wasooli)}
.btn{border:none;border-radius:10px;background:var(--cover);color:#FFF6E3;font:inherit;font-weight:700;font-size:16px;padding:10px 16px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.4}
.btn.gold{background:var(--gold);color:#2A1A04}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.danger{background:#FBE3DF;color:#7A1A12;border:1px solid #E7A79E}
.btn.wa{background:#167A47;color:#FFFFFF}
.btn.full{width:100%}
.btn.sm{min-height:42px;padding:6px 12px;font-size:14px}
label{font-size:14px;color:var(--ink2);display:block;margin-bottom:2px}
input,select,textarea{width:100%;min-height:48px;border-radius:8px;border:1px solid var(--line);background:#FFFFFF;color:var(--ink);font:inherit;font-size:16px;padding:8px 12px}
html[lang="ur"] input,html[lang="ur"] select,html[lang="ur"] textarea{font-size:17px;line-height:2}
textarea{min-height:90px;resize:vertical}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0}
.list{display:flex;flex-direction:column}
.cust{display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:none;border-bottom:1px solid var(--rule);padding:10px 2px;color:var(--ink);font:inherit;text-align:start;width:100%;cursor:pointer;min-height:58px}
.cust:last-child{border-bottom:none}
.cust b{font-size:16px;font-weight:700}
.cust small{display:block;color:var(--ink2);font-size:13px;line-height:1.6}
.amt{text-align:end;font-weight:700;flex-shrink:0}
.amt small{font-weight:400;color:var(--ink2);font-family:inherit}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:0 6px;background:#F3E3BF;color:#5A3A06;margin-inline-start:6px;line-height:1.8}
.late{background:#FBE3DF;color:#7A1A12}
.confirm{border:2px solid var(--gold)}
/* register table */
.regwrap{overflow-x:auto;margin-inline:-16px;padding-inline:16px}
table.reg{width:100%;border-collapse:collapse;background:var(--paper)}
table.reg tr.tap{cursor:pointer}
table.reg tr.tap:hover td,table.reg tr.tap:focus td{background:#FBF0D3}
table.reg td.dt{white-space:nowrap}
table.reg td.det svg{vertical-align:middle;color:var(--wasooli)}
table.reg th{background:#F4E8CC;color:var(--cover);font-size:13px;font-weight:700;padding:6px 4px;border-bottom:2px solid var(--margin);border-top:1px solid var(--line);text-align:center;white-space:nowrap}
table.reg td{padding:8px 4px;border-bottom:1px solid var(--rule);font-size:14px;vertical-align:middle;text-align:center}
table.reg td.det{text-align:start;min-width:64px}
table.reg td.no{width:26px}
table.reg td.det small{display:block;color:var(--ink2);font-size:12px;line-height:1.5}
table.reg td.no{color:var(--ink2);border-inline-end:2px solid var(--margin);width:34px}
table.reg tr.tot td{border-top:2px solid var(--ink);border-bottom:3px double var(--ink);font-weight:700;background:#FBF3DE}
table.reg .acts{white-space:nowrap}
.mini{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#FFFFFF;color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 8px 24px rgba(94,26,26,.35);min-height:56px;padding:12px 26px;border-radius:999px;font-size:17px}
.note{font-size:13px;color:var(--ink2);line-height:1.6}
html[lang="ur"] .note{font-size:14px;line-height:2}
.warnbox{background:#FFF0D6;border:1px solid #E9C27A;color:#5A3A06;border-radius:8px;padding:10px 12px;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.seg button{border:1px solid var(--line);background:#FFFFFF;color:var(--ink);font-size:16px;border-radius:10px;min-height:52px;cursor:pointer}
.seg button.ur{font-family:var(--urdu);font-size:18px}
.seg button.ps{font-family:var(--pashto);font-size:18px}
.seg button.lat{font-family:var(--latin)}
.seg button[aria-pressed="true"]{background:var(--cover);color:#FFF6E3;border-color:var(--cover);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#FFF6E3;font-weight:700;font-size:14px;border-radius:999px;padding:8px 18px;z-index:9;max-width:90vw;text-align:center}
.empty{text-align:center;padding:20px 8px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.modal{position:fixed;inset:0;background:rgba(30,15,5,.55);z-index:9;display:flex;align-items:flex-end;justify-content:center;padding:16px;overflow-y:auto}
.modal .page{width:100%;max-width:560px;margin-bottom:env(safe-area-inset-bottom,0px);max-height:92vh;overflow-y:auto}
.preview{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.today{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--rule);padding:6px 0;font-size:14px}
.today:last-child{border-bottom:none}
/* ===== Jugnu firefly (original bot style) ===== */
.ff{overflow:visible;display:block}
.ff .float{animation:ffFloat 3.2s ease-in-out infinite}
@keyframes ffFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ff .wL{transform-origin:96px 90px;animation:ffL 1.6s ease-in-out infinite}
.ff .wR{transform-origin:104px 90px;animation:ffR 1.6s ease-in-out infinite}
@keyframes ffL{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
@keyframes ffR{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}
.ff .px{fill:#8FE3FF;animation:ffPx 1.8s ease-in-out infinite}
@keyframes ffPx{0%,100%{opacity:.25}50%{opacity:1}}
.ff .halo{transform-origin:100px 118px;animation:ffBr 3.2s ease-in-out infinite}
@keyframes ffBr{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.06);opacity:.95}}
.ff .flash{transform-origin:100px 118px;opacity:.12}
.ff .core{transform-origin:100px 118px}
.ff .eyes{transition:transform .35s ease}
.ff .eo{transform-origin:100px 117px;animation:ffBl 4.2s infinite}
@keyframes ffBl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.ff .eh{opacity:0;transition:opacity .25s}
.ffw.thinking .flash,.ffw.listening .flash{animation:ffFire 1.6s ease-in-out infinite}
.ffw.thinking .core{animation:ffFlick 1.6s ease-in-out infinite}
@keyframes ffFire{0%,100%{opacity:.08;transform:scale(.9)}12%{opacity:1;transform:scale(1.28)}28%{opacity:.3;transform:scale(1)}42%{opacity:.85;transform:scale(1.16)}62%{opacity:.12;transform:scale(.95)}}
@keyframes ffFlick{0%,100%{filter:brightness(.8)}12%{filter:brightness(1.4)}42%{filter:brightness(1.3)}62%{filter:brightness(.85)}}
.ffw.thinking .eyes{transform:translate(4px,-7px)}
.ffw.thinking .eo{animation:none;transform:scaleY(.65)}
.ffw.thinking .wL,.ffw.thinking .wR,.ffw.listening .wL,.ffw.listening .wR{animation-duration:.25s}
.ffw.thinking .px,.ffw.listening .px{animation-duration:.6s}
.ffw.happy .eo{opacity:0}
.ffw.happy .eh{opacity:1}
.ffw.happy .float{animation:ffHop .5s ease-out 2}
@keyframes ffHop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.logo .ffw{width:34px;height:34px;margin-inline-end:2px}
.logo{align-items:center}
.ffbtn{position:fixed;inset-inline-start:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 50% 45%,#2A2140,#0C0B12 70%);box-shadow:0 0 22px rgba(255,190,80,.45),0 8px 20px rgba(0,0,0,.35);cursor:pointer;display:grid;place-items:center;padding:0}
.ffbtn .ffw{width:58px;height:58px}
.jsheet{background:#0C0B12;color:#F7F3EA;border:1px solid #2B2836;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;margin-bottom:env(safe-area-inset-bottom,0px)}
.jsheet .jtop{display:flex;align-items:center;gap:12px}
.jsheet .jtop .ffw{width:96px;height:96px;flex-shrink:0}
.jsheet .jname{font-family:var(--latin);font-weight:700;font-size:22px;letter-spacing:-.03em}
.jsheet .jstat{font-size:14px;color:#FFD25E;min-height:20px}
.jsheet .jclose{margin-inline-start:auto;align-self:flex-start;width:44px;height:44px;border-radius:22px;border:1px solid #2B2836;background:#16141F;color:#F7F3EA;cursor:pointer;font-size:20px}
.jchat{display:flex;flex-direction:column;gap:8px;max-height:38vh;overflow-y:auto;padding:2px}
.jmsg{max-width:88%;padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.6;white-space:pre-line}
html[lang="ur"] .jmsg{font-size:16px;line-height:2}
.jai{background:#16141F;border:1px solid #2B2836;align-self:flex-start;border-end-start-radius:5px}
.jme{background:#FF9F3A;color:#1A0E04;align-self:flex-end;border-end-end-radius:5px}
.jchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.jchip{flex-shrink:0;border:1px solid #2B2836;background:#16141F;color:#F7F3EA;font:inherit;font-size:14px;border-radius:999px;padding:8px 12px;cursor:pointer;min-height:42px}
.jform{display:flex;gap:8px}
.jform input{flex:1;min-width:0;background:#16141F;border-color:#2B2836;color:#F7F3EA}
.jform input::placeholder{color:#BDB5CC}
.jform .btn{background:#FF9F3A;color:#1A0E04}
.jhint{font-size:13px;color:#D3CDDD}
.toast .ffw{width:26px;height:26px;display:inline-block;vertical-align:middle;margin-inline-end:6px}

/* ===== Jugnu home (AI munshi is the main screen) ===== */
body.night{background:#08070D;color:#F7F3EA}
body.night header{display:none}
body.night .wrap{padding-bottom:0}
.jhome{display:flex;flex-direction:column;gap:10px;height:calc(100dvh - 96px - env(safe-area-inset-bottom,0px));min-height:440px}
.jhero{display:flex;align-items:center;gap:12px}
.jhero .ffw{width:88px;height:88px;flex-shrink:0}
.jname{font-family:var(--latin);font-weight:700;font-size:24px;letter-spacing:-.03em;color:#FFF6E3;line-height:1.2}
.jname small{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#FFD25E;margin-inline-start:6px}
.jstat{font-size:14px;color:#FFD25E;min-height:22px}
.jmode{display:inline-block;font-family:var(--latin);font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid #3A3648;color:#D3CDDD;margin-top:2px;line-height:1.7}
.jmode.on{border-color:#FFB547;color:#FFD25E}
.jhome .jchat{flex:1;min-height:0;max-height:none;overflow-y:auto;background:#0F0D17;border:1px solid #221F2C;border-radius:16px;padding:10px}
.jmsg.l-ur{font-family:var(--urdu),var(--latin);font-size:16px;line-height:2.1}
.jmsg.l-ps{font-family:var(--pashto),var(--latin);font-size:16px;line-height:1.8}
.jmsg.l-en,.jmsg.l-roman{font-family:var(--latin);font-size:15px;line-height:1.55}
.jai{color:#F7F3EA}
.jbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;white-space:normal}
.jbtns .jchip{min-height:38px;padding:6px 12px;font-size:14px;background:#221E2E;border-color:#3A3648}
.jbtns .jyes{background:#FF9F3A;color:#1A0E04;border-color:#FF9F3A;font-weight:700}
.jcard{margin-top:8px;background:#FFFBF0;color:#1F1A17;border:2px solid #E2B04A;border-radius:10px;padding:8px 10px;white-space:normal}
.jcard .jr{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #E6D9BC;padding:2px 0;font-size:14px}
.jcard .jr:last-of-type{border-bottom:none}
.jcard .jr span{color:#4A3F36}
.jcard .jnew{font-size:12px;color:#7A4A06;margin-top:4px;line-height:1.7}
.jcard .jdone{font-weight:700;color:#17643A;margin-top:4px}
.jcard .jdone.no{color:#7A1A12}
.jcard .jbtns .jchip{background:#FFFFFF;color:#1F1A17;border-color:#D8C9A6}
.jcard .jbtns .jyes{background:#5E1A1A;color:#FFF6E3;border-color:#5E1A1A}
.jhome .jform input{min-height:52px}
.jhome .jform .btn{min-width:64px}
/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#FFFBF0;border-top:2px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs.stuTabs{grid-template-columns:repeat(3,minmax(0,1fr))}
.tabs button{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--ink2);font:inherit;font-size:13px;line-height:1.3;cursor:pointer;padding:4px 2px}
html[lang="ur"] .tabs button{font-size:14px;line-height:1.7}
.tabs button[aria-current="page"]{color:var(--cover);font-weight:700}
.tabs .tdot{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFF6D6,#FFD25E 45%,#FF8A2B);box-shadow:0 0 10px 3px rgba(255,190,80,.55)}
body.night .tabs{background:#0C0B12;border-top-color:#2B2836}
body.night .tabs button{color:#CFC8DA}
body.night .tabs button[aria-current="page"]{color:#FFD25E}

/* family profiles + Ustad */
.pchip{margin-inline-start:auto;align-self:flex-start;display:flex;align-items:center;gap:6px;border:1px solid #3A3648;background:#16141F;color:#F7F3EA;border-radius:999px;padding:4px 10px 4px 4px;font:inherit;font-size:13px;cursor:pointer;max-width:46%;min-height:40px}
.pchip span[dir]{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pav{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--latin);font-weight:700;font-size:14px;flex-shrink:0;background:#FFB547;color:#2A1404}
.pav.student{background:#5FB8FF;color:#06223A}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px;background:#FFFFFF}
.prow.on{border:2px solid var(--gold)}
.pbtn{flex:1;display:flex;align-items:center;gap:10px;background:none;border:none;font:inherit;color:var(--ink);text-align:start;cursor:pointer;min-height:48px}
.pbtn .pav{width:40px;height:40px;font-size:17px}
.pbtn small{display:block;color:var(--ink2);font-size:13px;line-height:1.5}
.linkcode{font-size:40px;font-weight:700;text-align:center;letter-spacing:.12em;color:var(--cover);padding:8px 0}
.ustadT .jname small{color:#9BE7FF}
.ustadT .jstat{color:#9BE7FF}
.ustadT .jme{background:#5FB8FF;color:#06223A}
.ustadT .jform .btn{background:#5FB8FF;color:#06223A}
body.night.stu .tabs button[aria-current="page"]{color:#9BE7FF}
.modal .page{color:var(--ink)}
.vbtn{display:grid;place-items:center;min-width:48px;border-radius:10px;border:1px solid #2B2836;background:#16141F;color:#FFD25E;cursor:pointer}
.ustadT .vbtn{color:#9BE7FF}
.vbtn.rec{background:#C62828;color:#fff;border-color:#C62828;font:700 14px/1 system-ui;animation:recp 1.2s infinite}@keyframes recp{50%{opacity:.75}}

.jcard .jover{font-size:13px;font-weight:700;color:#7A1A12;background:#FBE3DF;border-radius:6px;padding:4px 8px;margin-top:6px;line-height:1.6}
.cmem{display:flex;flex-wrap:wrap;gap:6px}
.cm{border:1px solid var(--line);background:#FFFFFF;color:var(--ink);font:inherit;font-size:14px;border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer}
.cm.ok{background:#DDF3E5;border-color:#17643A;color:#0E3D23;font-weight:700}
.cm.turn{outline:2px solid var(--gold);outline-offset:1px}
.jmsg:has(.qcard){width:88%}
.qcard{margin-top:8px;background:#FFFFFF;color:#1F1A17;border:2px solid #5FB8FF;border-radius:12px;padding:10px;white-space:normal;font-family:var(--latin)}
.qcard .qq{font-weight:700;font-size:15px;line-height:1.5;margin-bottom:8px}

/* Roman <-> Urdu/Pashto name matching: both scripts reduce to the same consonant skeleton (Bilal = بلال = "bll") */
const AR2L={'ب':'b','پ':'p','ت':'t','ٹ':'t','ټ':'t','ث':'s','ج':'j','چ':'c','ح':'h','خ':'k','د':'d','ڈ':'d','ډ':'d','ذ':'z','ر':'r','ڑ':'r','ړ':'r','ز':'z','ژ':'z','ږ':'z','ځ':'z','س':'s','ش':'s','ښ':'s','ص':'s','ض':'z','ط':'t','ظ':'z','غ':'g','ف':'f','ق':'k','ک':'k','ك':'k','گ':'g','ګ':'g','ل':'l','م':'m','ن':'n','ں':'n','څ':'s'};

function skel(w){w=String(w||'').toLowerCase();let o='';
  if(isAr(w)){[...w].forEach((ch,i)=>{if(ch==='ہ'||ch==='ه')o+=i===0?'h':'';else o+=AR2L[ch]||'';});}

const UNITW={sau:100,so:100,hazar:1000,hazaar:1000,hzar:1000,hajar:1000,thousand:1000,k:1000,lakh:100000,lac:100000,'سو':100,'ہزار':1000,'لاکھ':100000,'سل':100,'زره':1000,'زر':1000,'لک':100000};
const EXP_ACC={roman:'Dukaan kharcha',ur:'دکان کا خرچہ',ps:'د دوکان لګښت',en:'Shop expenses'};
function pTokens(raw){return toAsciiDigits(raw).toLowerCase().replace(/(\d),(\d)/g,'$1$2').replace(/(\d)\s*k\b/g,'$1 k').replace(/[!?،؟۔,;:"'()]/g,' ').replace(/\.(?!\d)/g,' ').split(/\s+/).filter(Boolean);}
function pAmounts(tk){const out=[];
  for(let i=0;i<tk.length;i++){const w=tk[i];let v=null,used=1;
    if(/^\d+(\.\d+)?$/.test(w)){v=parseFloat(w);}else if(NUMW[w]!=null&&UNITW[tk[i+1]]){v=NUMW[w];}
    if(v==null)continue;
    let u=UNITW[tk[i+1]];if(u){v*=u;used=2;const u2=UNITW[tk[i+2]];if(u===100&&u2===1000){v*=1000;used=3;}}
    const next=tk[i+used]||'';out.push({v:Math.round(v),i,end:i+used,qty:P_QTY.test(next),money:/^(rs|rupay|rupaye|ki|ka|ke|کی|کا|کے|روپے|روپۍ)$/.test(next)||/^rs$/.test(tk[i-1]||'')});
    i+=used-1;}
  return out;}
function parseEntry(raw){
  const tk=pTokens(raw);if(!tk.length)return null;const s=' '+tk.join(' ')+' ';
  const am=pAmounts(tk);if(!am.length)return null;
  const money=am.filter(a=>!a.qty);const pick=(money.find(a=>a.money)||money.sort((a,b)=>b.v-a.v)[0]);if(!pick||pick.v<1)return null;
  const amount=pick.v;
  const via=/jazz ?cash|جاز ?کیش/.test(s)?'JazzCash':/easy ?paisa|ایزی ?پیسہ|ایزي ?پیسه/.test(s)?'Easypaisa':/\b(bank|raast)\b|بینک|بانک|راست/.test(s)?'Bank':/\b(naqad|cash)\b|نقد|نغدې/.test(s)?'':'';
  /* items + quantity note */
  const items=[];for(let i=0;i<tk.length;i++){if(P_ITEMS.test(tk[i])){let q='';const a=am.find(x=>x.qty&&x.end===i-1);if(a)q=tk.slice(a.i,i).join(' ')+' ';if(!items.includes(q+tk[i]))items.push(q+tk[i]);}}
  /* expense? (no person, a shop cost) */
  const hit=nameInText(raw);
  if(P_SALE.test(s)&&!hit&&!/\b(ne|ko)\b|نے|کو/.test(s)){const l=detectLang(raw);return{name:SALE_ACC[l]||SALE_ACC.roman,amount,type:'sale',date:todayISO(),note:[items.join(', '),via].filter(Boolean).join(' · ')};}
  const expM=s.match(P_EXP);
  if(expM&&!hit&&!/\b(ne|ko)\b|نے|کو/.test(s.replace(/\bka bill\b/,''))){
    const l=detectLang(raw);const label=tk.filter(w=>!P_FILL.has(w)&&!P_MARK.has(w)&&!P_VERB.test(w)&&!/^\d/.test(w)&&!UNITW[w]&&!NUMW[w]).slice(0,3).join(' ');
    return{name:EXP_ACC[l]||EXP_ACC.roman,amount,type:'expense',date:todayISO(),note:[cap(label),via].filter(Boolean).join(' · ')};}
  /* type from the whole sentence */
  const isAr=/[؀-ۿ]/.test(s);
  const took=/\b(liya|liye|li|le gaya|le gayi|le gai|le gya|le gaye|khareed\w*|kharid\w*|udhaar|udhar|took|bought|credit)\b|لیا|لیے|لے گیا|لے گئی|لے گئے|خرید|ادھار|واخیست|پور/.test(s);
  const gave=/\b(diye|diya|di|dia|de diye|bheje|bhej\w*|jama|ada|mile|mila|mili|wapis|wasool|wusool|received|paid|sent|gave|returned)\b|دیے|دئیے|دیئے|دیا|بھیج|جمع|ادا|ملے|ملا|واپس|وصول|راکړ|راولېږ/.test(s);
  const goods=/\b(maal|mal|stock|supply|delivery)\b.*\b(aaya|aya|aayi|aye|diya|bheja|mila)\b|مال.*(آیا|آئے|ملا)|سٹاک|مال راغی|راغلل/.test(s);
  const fromSe=/\bse\b|سے|څخه|نه /.test(s),toKo=/\bko\b|کو|ته /.test(s),byNe=/\bne\b|نے/.test(s);
  let type;
  if(goods)type='goods';
  else if(/\b(maine|mene|meine|humne|hamne)\b|میں نے|ہم نے/.test(s)&&toKo)type=took||/udhaar|ادھار|saman|سامان/.test(s)?'credit':'paid';
  else if(toKo&&!byNe)type=/(saman|samaan|maal|udhaar|udhar|سامان|ادھار|پور|سودا)/.test(s)?'credit':(gave?'paid':'credit');
  else if(fromSe&&/(wasool|wusool|mile|mila|received|وصول|ملے)/.test(s))type='payment';
  else if(took&&!(/(diye|de diye|bheje|jama|ada|wapis|paid|دیے|جمع|ادا|واپس|راکړ)/.test(s)&&!/(saman|udhaar|سامان|ادھار)/.test(s)))type='credit';
  else if(gave)type='payment';else type='credit';
  /* name: an existing account anywhere in the sentence, else the words just before ne/ko/se/ka */
  let name='';
  if(hit){name=hit.c.name;if(hit.tok)learnAlias(hit.c,hit.tok);}
  else{
    const stop=w=>P_FILL.has(w)||P_MARK.has(w)||P_VERB.test(w)||P_QTY.test(w)||P_ITEMS.test(w)||/^\d/.test(w)||UNITW[w]||(NUMW[w]!=null)||/^(saman|samaan|maal|mal|stock|bill|ki|ka|ke|wali|wala|baqaya|hisaab|سامان|مال|حساب|سودا|goods|money|paisay|paise|پیسے|پیسې)$/.test(w)||/(jazz|easy|cash|bank|raast|paisa)/.test(w);
    const titles=/^(sahib|sahab|saab|bhai|baji|baaji|chacha|mamu|khan|ji|صاحب|بھائی|باجی|چچا|خان|ماما|لالا|lala)$/;
    let mi=tk.findIndex((w,i)=>i>0&&P_MARK.has(w)&&!stop(tk[i-1]));
    if(mi<0)mi=tk.findIndex((w,i)=>i>0&&(P_VERB.test(w)||/^\d/.test(w))&&!stop(tk[i-1]));
    if(mi>0){let j=mi-1;const parts=[];while(j>=0&&parts.length<3&&(!stop(tk[j])||titles.test(tk[j]))){parts.unshift(tk[j]);j--;}name=parts.join(' ');}
  }
  if(!name)return null;
  let nm=hit?name:cap(name);const ex=hit?hit.c:findByName(nm);
  if(ex){nm=ex.name;if(ex.type==='supplier'){if(type==='credit')type='goods';if(type==='payment')type='paid';}if(ex.type==='customer'&&type==='paid')type='credit';if(ex.type==='customer'&&type==='goods')type='credit';}
  const note=[items.join(/[؀-ۿ]/.test(s)?'، ':', '),via].filter(Boolean).join(' · ');
  return{name:nm,amount,type,date:todayISO(),note};
}

/* v0.10 story reader: understands a whole voice note or long message */
const STORY_PROMPT="You are the munshi (bookkeeper) of a Pakistani shop. The shopkeeper told you what happened, usually as a voice note turned into text. The text may be Urdu, Pashto, Roman Urdu, Roman Pashto or English. Pashto speech is often written by speech-to-text phonetically in Urdu letters (e.g. \"راکڑل\", \"یوڑہ\", \"زرہ\", \"روپئی\"), and Urdu speech sometimes in Hindi (Devanagari) script; read the meaning either way. Pashto money words: پور/por = udhaar, راکړل/rakral = gave to me (the shop), ورکړل/warkral = I (the shop) gave, یوړل/yawral = took away, اخیستل/akhistal = bought or took, سودا = goods, زره/zara = thousand, سوه/sawa = hundred, لک = lakh, نیم = half. Speech-to-text may misspell words; guess the intended word from context.\nExisting accounts: {{ACCTS}}\nText: <<{{TEXT}}>>\nTask: understand the whole story and list EVERY money movement in it, one entry each.\n- \"name\": only the person or business the money is with. If it matches an existing account (even spelled differently or in another script), copy that exact account name. Otherwise write the name in {{LANG}}. Never use words like aaj, kal, maine, banda, larka, gaahak as a name; for \"Haji sahib ka banda\" the name is the Haji sahib account.\n- \"type\": credit = customer took goods or cash on udhaar and now owes the shop; payment = customer paid money to the shop or returned udhaar; goods = supplier delivered stock to the shop on credit; paid = shop paid money to a supplier; expense = shop cost with no person (bijli, gas, bill, kiraya, rent, salary, petrol), name = \"Kharcha\"; sale = total cash sales of the day, name = \"Sale\".\n- Direction help: \"maine X ko diye\" / \"X ta me warkral\" means the shop gave X money (credit for a customer, paid for a supplier); \"X se liye / X ne diye / X ne bheje / X rakral\" means X gave the shop money (payment for a customer); \"X maal de gaya / maal rawor\" from a supplier is goods.\n- \"amount\": rupees as a plain integer. Convert number words: sau=100, hazar/hazaar=1000, lakh=100000, dedh=1.5, dhai=2.5, sawa=1.25, saarhe=+0.5; Urdu script and Hindi number words the same way (pandrah sau = 1500, do hazar = 2000, paintalis hazar = 45000; Pashto: dwa zara/دوه زره = 2000, pinzalas sawa/پنځلس سوه = 1500, dray zara = 3000, lass zara = 10000). Quantities like \"3 kilo\" are not amounts.\n- \"note\": short reason or items in {{LANG}} (e.g. \"3 kilo cheeni, ghee ka dabba\", \"dawai ke liye\", \"pichla udhaar wapis\"), plus JazzCash/Easypaisa/bank if said, else \"\".\n- Pashto help (speech-to-text writes Pashto phonetically, often with Urdu letters and spelling mistakes): number words yaw/یو=1, dwa/دوه=2, dre/درې=3, tsalor/څلور=4, pinza/پنځه=5, shpag/شپږ=6, owa/اووه=7, ata/اته=8, naha/نهه=9, las/لس=10, shel/شل=20, dersh/دېرش=30, tsalwekht/څلوېښت=40, panzos/پنځوس=50, sal/sawa/سل/سوه=100, zar/zara/زر/زره=1000, lakh/لک=100000; pinzalas sawa/پنځلس سوه=1500, dwa zara/دوه زره=2000. Words: rakral/راکړل/راکړې = gave to the shop (payment); warkral/ورکړل = the shop gave to someone (credit for a customer, paid for a supplier); yowral/یوړل/وړل = took away (on udhaar = credit); por/پور = udhaar; pa por = on credit; bira/بېرته = back/returned; rawral/راوړل = brought (supplier goods); kharts/خرڅ = spent or sold; nan/نن = today, parun/پرون = yesterday; roopai/روپۍ = rupees.\n- Do not invent entries. Promises about the future (\"baqi agle hafte dega\") and things that did NOT happen (\"wapis nahi kiye\") are not entries.\n- If the text is only a question or chat with no money movement, return an empty list.\n- \"summary\": one short sentence in {{LANG}} retelling what happened, for the shopkeeper to confirm.\nReply with only JSON: {\"entries\":[{\"name\":\"\",\"type\":\"\",\"amount\":0,\"note\":\"\"}],\"summary\":\"\"}";
const STORY_LANG={ur:'Urdu script',ps:'Pashto script',en:'English',roman:'Roman Urdu'};
function looksStory(q){const w=String(q).trim().split(/\s+/).length;return /[ऀ-ॿ]/.test(q)||w>=9||(String(q).match(/\d+/g)||[]).length>=2||/(\bsau\b|hazar|hazaar|\blakh|سو|ہزار|لاکھ|زره|سل)/i.test(q);}
async function readStory(q,l){
  try{const accts=D.customers.filter(c=>c.type!=='expense'&&c.type!=='sales').slice(0,80).map(c=>`${c.name} (${c.type})`).concat(['Kharcha (expense)','Sale (sales)']).join(', ');
    const prompt=STORY_PROMPT.split('{{ACCTS}}').join(accts).split('{{TEXT}}').join(String(q).slice(0,3000)).split('{{LANG}}').join(STORY_LANG[l]||'Roman Urdu');
    let r=null;try{r=await aiJSON(prompt,'@cf/openai/gpt-oss-120b');}catch(e){r=null;}if(!r||!Array.isArray(r.entries)){try{r=await aiJSON(prompt);}catch(e){r=null;}}if(!r||!Array.isArray(r.entries))return null;
    const out=[];
    for(const e of r.entries.slice(0,8)){if(!e)continue;
      const ty=['credit','payment','goods','paid','expense','sale'].includes(e.type)?e.type:null;const amt=Math.round(Number(e.amount));
      if(!ty||!(amt>=1&&amt<1e9))continue;
      let name=String(e.name||'').trim().slice(0,40);const note=String(e.note||'').trim().slice(0,70);
      if(ty==='sale')name=SALE_ACC[l]||SALE_ACC.roman;
      else if(ty==='expense')name=EXP_ACC[l]||EXP_ACC.roman;
      else{if(!name)continue;const ex=findByName(name);name=ex?ex.name:cap(name);}
      let t2=ty;const ex2=findByName(name);if(ex2&&ex2.type==='supplier'){if(t2==='credit')t2='goods';if(t2==='payment')t2='paid';}
      out.push({name,amount:amt,type:t2,date:todayISO(),note});}
    return{entries:out,summary:String(r.summary||'').trim().slice(0,300)};
  }catch(e){return null;}
}

async function jSend(q){
  q=String(q||'').trim();if(!q||jBusy)return;hbNote(q,'j');jBusy=true;
  const l=detectLang(q);
  jPush({who:'me',text:q,l});jState('thinking');
  await sleep(450);
  if(aiOn()&&looksStory(q)){const st=await readStory(q,/[\u0900-\u097F]/.test(q)?D.lang:l);if(st&&st.entries.length){storyCards(st,q,/[\u0900-\u097F]/.test(q)?D.lang:l);jBusy=false;return;}}
  let a=jugnuAnswer(q,l);
  if(a.entry&&aiOn()){a={entry:await refineEntry(q,l,a.entry)};}
  else if(!a.entry&&aiOn()&&(a.text===jt('dont',l)||a.kind==='idea')){const r=await askAI(q,l,a.kind==='idea'?'advice':'chat');if(r)a=r;}
  else if(!a.entry&&!aiOn()&&a.text===jt('dont',l))a={text:jt('dont',l)+'\n'+jt('needNet',l)};
  jHandle(a,q,l);jBusy=false;
}
function custBtns(cid,l){const c=cust(cid);if(!c)return[];const b=balance(cid);const out=[{act:'jOpen',id:cid,label:jt('openB',l)}];
  if(c.type==='customer'&&b>0)out.push({act:'jRemind',id:cid,label:jt('remindB',l)});
  out.push({act:'jStmt',id:cid,label:jt('stmtB',l)});return out;}
function jHandle(a,q,l){
  if(a.entry){const id=uid();S.drafts[id]=markAmb(Object.assign({},a.entry,{type:a.entry.type||'credit',raw:q,l}),q);
    jPush({who:'ai',text:a.text||jt('confirmQ',l),card:id,l});jState('idle');return;}
  const btns=a.cid?custBtns(a.cid,l):[];if(a.kind==='com')btns.push({act:'comOpen',id:'',label:ct('open',l)});if(a.kind==='health'&&aiOn())btns.push({act:'jMore',id:l,label:jt('more',l)});
  jPush({who:'ai',text:a.text,btns,l});
  jState(a.text===jt('dont',l)?'idle':'happy');setTimeout(()=>{if(!jBusy)jState('idle');},1400);
}
function commitEntry(d){
  let c=(d.cid&&cust(d.cid))||findByName(d.name);if(!c){c={id:uid(),name:cap(d.name),phone:'',type:d.type==='expense'?'expense':d.type==='sale'?'sales':(d.type==='goods'||d.type==='paid')?'supplier':'customer',created:Date.now()};D.customers.push(c);}
  let saved;
  if(d.id){saved=D.entries.find(x=>x.id===d.id);if(saved)Object.assign(saved,{cid:c.id,amount:d.amount,type:d.type,date:d.date,note:d.note||''});if(saved&&d.type==='payment'&&!saved.rno)saved.rno=D.seq++;}
  else{saved={id:uid(),cid:c.id,amount:d.amount,type:d.type,date:d.date||todayISO(),note:d.note||'',created:Date.now()};if(d.type==='payment')saved.rno=D.seq++;D.entries.push(saved);}
  save();return{c,saved};
}

}

const LNAME={ur:'Urdu in Urdu script (the Nastaliq / Arabic alphabet)',roman:'Roman Urdu (Urdu written in English letters, like a WhatsApp message)',ps:'Pashto in Pashto script',en:'simple English'};
const ADDR={ur:'سیٹھ جی',roman:'Seth ji',ps:'مالک صاحب',en:'sir'};
async function refineEntry(q,l,d){
  try{const accts=D.customers.slice(0,60).map(c=>`${c.name} (${c.type})`).join(', ')||'(none)';
    const prompt=`You read one sentence a Pakistani shopkeeper said about his khata (ledger) and extract the entry. It may be Roman Urdu, Urdu, Pashto or English.
Existing accounts: ${accts}
Sentence: <<${q}>>
Rules: "name" is ONLY the person or business the money is with (never words like aaj, kal, maine, naya, gaahak; titles like bhai, sahib, baji may stay). If it matches an existing account, copy that exact name. "type" is one of: credit (customer took goods or cash on udhaar), payment (customer paid the shop), goods (supplier delivered stock to the shop), paid (shop paid a supplier), expense (shop cost with no person: bijli, bill, kiraya, rent, salary, petrol; then name is the cost, e.g. "Bijli bill"), sale (total cash sales of the day, no person, e.g. "aaj ki sale 15000"). "amount" in rupees as an integer. "note" is short: items bought or the reason, plus payment method if said (JazzCash, Easypaisa, bank), else "".
Reply with only JSON like {"name":"","amount":0,"type":"","note":""}`;
    const r=await aiJSON(prompt);if(!r||typeof r!=='object')return d;
    const ty=['credit','payment','goods','paid','expense','sale'].includes(r.type)?r.type:d.type;
    const nd=Object.assign({},d,{type:ty});
    const amt=Math.round(Number(r.amount));if(!d.amount&&amt>0)nd.amount=amt;
    const note=String(r.note||'').trim().slice(0,60);if(note&&note.length>=2)nd.note=note;
    if(ty==='sale'){nd.name=SALE_ACC[l]||SALE_ACC.roman;return nd;}
    if(ty==='expense'){nd.name=EXP_ACC[l]||EXP_ACC.roman;if(!note&&r.name)nd.note=String(r.name).slice(0,40);return nd;}
    if(d.type==='expense'&&ty!=='expense'&&!r.name)return d;
    const nm=String(r.name||'').trim();
    if(nm&&!findByName(d.name)){const ex=findByName(nm);if(ex)nd.name=ex.name;else if(norm(q).includes(norm(nm).split(' ')[0]))nd.name=cap(nm);}
    const ex2=findByName(nd.name);if(ex2&&ex2.type==='supplier'){if(nd.type==='credit')nd.type='goods';if(nd.type==='payment')nd.type='paid';}
    return nd;
  }catch(e){return d;}
}
async function askAI(q,l,mode){
  try{
    const td=todayISO();const aaj=D.entries.filter(e=>e.type==='payment'&&e.date===td).reduce((s,e)=>s+e.amount,0);
    const led=D.customers.map(c=>{const b=balance(c.id);return `- ${c.name} | ${c.type} | ${b>0?'owes the shop Rs '+num(b):b<0?'the shop owes Rs '+num(b):'settled'} | oldest unpaid: ${oldestUnpaidDays(c.id)} days`;}).join('\n')||'(no accounts yet)';
    const hist=S.chat.slice(-7,-1).map(m=>(m.who==='me'?'Shopkeeper: ':'Jugnu: ')+m.text).join('\n');
    const prompt=`You are Jugnu, a Pakistani AI assistant who works as the munshi (trusted bookkeeper and advisor) of a small shop. You understand Urdu in Urdu script, Roman Urdu, Pashto and English.
You help with: the shop's khata, practical business advice for small Pakistani shops (personalise it with the ledger numbers below), everyday questions, and friendly chat.
Rules:
- Reply ONLY in ${LNAME[l]}, the same language and script the shopkeeper just used. Address him as "${ADDR[l]}".
- Talk like a respectful, loyal old-school munshi: warm, practical, simple words. No emojis. No dashes.
- Length: ${mode==='advice'?'up to 4 short numbered points, each one line, low cost and doable this week in a Pakistani market (JazzCash, Easypaisa, Raast QR, WhatsApp, local suppliers)':'at most 3 short sentences'}.
- Use ONLY the numbers in the ledger below. Never invent a balance.
- Medical, legal or religious ruling questions: give only a short, general, safe answer and advise him to ask a doctor, a lawyer or a mufti. Never give medicine doses. Money or investment questions: say it is general information, not financial advice.
- If his message records a transaction, fill "entry" with name, amount (rupees, integer) and type: "credit" (customer took goods on udhaar), "payment" (customer paid the shop), "goods" (supplier delivered stock), "paid" (shop paid a supplier), "expense" (shop cost like electricity bill, rent, salary, fuel; then name is the cost). Put items or reason in "note". Do NOT say it is saved: the app shows a confirm card.
- If the message is about one person in the ledger, put their exact ledger name in "customer". Set "action" to "remind" if he wants a WhatsApp reminder, or "statement" if he wants their statement.
Shop: ${D.shop.name}${D.shop.city?', '+D.shop.city:''}. Today: ${td}. Collected today: Rs ${num(aaj)}.
Ledger:
${led}
Recent chat:
${hist||'(none)'}
Shopkeeper's new message: """${q}"""
Reply with only JSON like {"reply":"...","entry":null,"customer":null,"action":null}`;
    const r=await aiJSON(prompt);
    if(!r||typeof r.reply!=='string'||!r.reply.trim())return null;
    const out={text:r.reply.trim().slice(0,900)};const e=r.entry;
    if(e&&typeof e==='object'){const amt=Math.round(Number(toAsciiDigits(String(e.amount||'')).replace(/[^\d.]/g,'')));const ty=['credit','payment','goods','paid','expense','sale'].includes(e.type)?e.type:null;const nm=String(e.name||'').trim().slice(0,60);
      if(amt>0&&ty&&nm){const ex=findByName(nm);let t2=ty;if(ex&&ex.type==='supplier'){if(t2==='credit')t2='goods';if(t2==='payment')t2='paid';}out.entry=t2==='expense'?{name:EXP_ACC[l]||EXP_ACC.roman,amount:amt,type:'expense',date:td,note:String(e.note||nm).slice(0,60)}:{name:ex?ex.name:cap(nm),amount:amt,type:t2,date:td,note:String(e.note||'').slice(0,60)};}}
    if(!out.entry&&r.customer){const c=findByName(String(r.customer));if(c){out.cid=c.id;if(r.action==='remind'||r.action==='statement')out.action=r.action;}}
    return out;
  }catch(err){if(err&&['not_granted','unavailable','capability_disabled','capability_removed'].includes(err.code)){SAMPLE=null;updMode();}return null;}
}
function doRemind(c){const p=phone92(c.phone);if(!p){toast(t('noPhone'));S.cid=c.id;editCustModal();return;}const tx=reminderText(c);

function markStudy(p,asked){const st=stuStats(p);const td=todayISO();if(!st.days.includes(td))st.days.push(td);if(st.days.length>60)st.days=st.days.slice(-60);if(asked){st.asked.push(td);if(st.asked.length>500)st.asked=st.asked.slice(-500);}save();}
function weekSummary(p){const st=stuStats(p);const wk=todayISO(new Date(Date.now()-6*86400000));
  const days=st.days.filter(d=>d>=wk).length,asked=st.asked.filter(d=>d>=wk).length,qz=st.quizzes.filter(q=>q.d>=wk);
  const by={};st.quizzes.slice(-20).forEach(q=>{(by[q.sub]=by[q.sub]||{s:0,t:0});by[q.sub].s+=q.score;by[q.sub].t+=q.total;});
  const subs=Object.keys(by).map(k=>({k,p:Math.round(by[k].s/by[k].t*100)})).sort((a,b)=>b.p-a.p);
  return{days,asked,quizzes:qz.length,subs};}

let REC=null;
function recMime(){const c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac','audio/ogg'];if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return '';for(const m of c){try{if(MediaRecorder.isTypeSupported(m))return m;}catch(e){}}return '';}
function recPick(btn){const f=btn.parentNode.querySelector('input[data-voice]');if(f)f.click();}
async function recToggle(btn){
  if(REC){REC.stop();return;}
  if(!AI_URL||navigator.onLine===false){(isStudent()?uPush:jPush)({who:'ai',text:jt('vNet',D.lang),l:D.lang});return;}
  let framed=false;try{framed=window.self!==window.top;}catch(e){framed=true;}
  const why=framed?'frame':!window.isSecureContext?'insecure':!navigator.mediaDevices?'no-media':!navigator.mediaDevices.getUserMedia?'no-gum':!window.MediaRecorder?'no-recorder':'';
  if(why){(isStudent()?uPush:jPush)({who:'ai',text:jt(why==='frame'?'vInApp':'vNoRec',D.lang)+'\nhttps://mychatgptapplogin-hash.github.io/Jugnu/\n('+why+')',btns:[{act:'vPick',id:'',label:jt('vPickB',D.lang)}],l:D.lang});return;}
  let stream;const ta=Date.now();
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){
    const nm=(e&&e.name)||'';const push=isStudent()?uPush:jPush;
    if(nm==='NotFoundError'||nm==='NotReadableError'||nm==='AbortError'){push({who:'ai',text:jt('vNoMic',D.lang),l:D.lang});return;}
    push({who:'ai',text:jt(Date.now()-ta<700?'vBlocked':'vPerm',D.lang),l:D.lang});return;}
  const mime=recMime();let mr;try{mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch(e){stream.getTracks().forEach(t=>t.stop());recPick(btn);return;}
  const chunks=[];const t0=Date.now();const svg=btn.innerHTML;
  const tick=()=>{const s=Math.floor((Date.now()-t0)/1000);btn.textContent='■ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s>=90)mr.stop();};
  REC=mr;btn.classList.add('rec');btn.setAttribute('aria-label',jt('vStop',D.lang));tick();const iv=setInterval(tick,500);
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  mr.onstop=()=>{clearInterval(iv);stream.getTracks().forEach(t=>t.stop());REC=null;
    document.querySelectorAll('.vbtn.rec').forEach(b=>{b.classList.remove('rec');b.innerHTML=svg;b.setAttribute('aria-label',jt('vBtn',D.lang));});
    const type=(mr.mimeType||mime||'audio/mp4').split(';')[0];const blob=new Blob(chunks,{type});
    if(Date.now()-t0<800||blob.size<1500)return;handleVoice(blob);};
  mr.start(1000);

async function transcribe(blob,l){
  const lang=l==='en'?'en':'ur';const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),45000);
  try{const r=await fetch(AI_URL+'transcribe',{method:'POST',headers:{'content-type':blob.type||'audio/ogg','x-lang':lang},body:blob,signal:ctl.signal});
    if(!r.ok)return null;const j=await r.json();return (j.text||'').trim()||null;}catch(e){return null;}finally{clearTimeout(tm);}}
async function handleVoice(blob){
  const l=D.lang;const stu=isStudent();const push=stu?uPush:jPush;
  if(!AI_URL||navigator.onLine===false){push({who:'ai',text:jt('vNet',l),l});return;}
  push({who:'ai',text:jt('vHear',l),l});jState('listening');
  let tx=await transcribe(blob,l);
  if(!tx){push({who:'ai',text:jt('vFail',l),l});jState('idle');return;}
  tx=tx.replace(/(\d),(?=\d{3}\b)/g,'$1').replace(/₹\s?/g,'Rs ');
  push({who:'ai',text:jt('vGot',l)+'\n"'+tx+'"',l});
  if(stu)uSend(tx);else jSendShared(tx,l);
}
async function jSendShared(text,vl){
  if(aiOn()&&!jBusy){jBusy=true;const l0=vl||(/[\u0900-\u097F]/.test(text)?D.lang:detectLang(text));jState('thinking');
    const st=await readStory(text,l0);jBusy=false;
    if(st&&st.entries.length){jPush({who:'me',text,l:l0});storyCards(st,text,l0);return;}
    jState('idle');}
  const l=detectLang(text);const a=jugnuAnswer(text,l);
  if(!a.entry&&/\d/.test(text)&&!jBusy){const d=draftFromAmount(text);
    if(d){let nd=d;if(aiOn())nd=await refineEntry(text,l,d);const id=uid();S.drafts[id]=markAmb(Object.assign({},nd,{raw:text,l}),text);
      jPush({who:'me',text,l});jPush({who:'ai',text:nd.name?jt('confirmQ',l):jt('noName',l),card:id,l});return;}}
  jSend(text);
}
async function handleShared(){
  if(!/[?&]shared=1/.test(location.search))return;
  try{history.replaceState(null,'',location.pathname);}catch(e){}
  let text='',audio=null;
  try{const c=await caches.open('jugnu-share');const tr=await c.match('./__share/text');if(tr)text=(await tr.text()).trim();
    const ar=await c.match('./__share/audio');if(ar)audio=await ar.blob();await c.delete('./__share/text');await c.delete('./__share/audio');}catch(e){}
  if(!text&&!audio)return;
  await sleep(300);
  if(audio){await handleVoice(audio);return;}
  if(isStudent())uSend(text);else{jPush({who:'ai',text:jt('shareIn',D.lang),l:D.lang});jSendShared(text);}
}

const HB_KEY='jugnu_habits_v1';

function hbCat(q){const s=' '+toAsciiDigits(String(q)).toLowerCase()+' ';
  if(/\d{2,}/.test(s)&&!/[?؟]/.test(s))return 'entry';
  if(/(wasool|wusool|collect|وصول|وصولي)/.test(s))return 'collect';
  if(/(purana|old|overdue|پرانا|زوړ)/.test(s))return 'old';
  if(/(yaad|remind|یاد|یادونه)/.test(s))return 'remind';
  if(/(most|zyada|ziada|زیادہ|زیات|kis ne|کس نے|د چا)/.test(s))return 'owe';
  if(/(\bsale\b|bikri|galla|سیل|خرڅلاو)/.test(s))return 'sale';
  if(/(kharch|expense|خرچ|لګښت)/.test(s))return 'exp';
  if(/(haal|halat|health|حال|how is my shop)/.test(s))return 'health';
  if(/(idea|mashwar|advice|tip|مشور|مشوره|aidia)/.test(s))return 'idea';
  if(/(committee|kameti|کمیٹی|کمېټ)/.test(s))return 'com';
  if(/(quiz|کوئز)/.test(s))return 'quiz';
  if(/(formula|فارمول)/.test(s))return 'formula';
  if(/(exam|paper|imtihan|امتحان|پرچ|ازموین)/.test(s))return 'exam';
  if(/(progress|report|کارکردگی|پرمختګ)/.test(s))return 'progress';
  return 'chat';}
function hbNote(q,src){const h=hb();const c=hbCat(q);h.cat[c]=(h.cat[c]||0)+1;

function nameCands(name,raw){
  const n=norm(name||'');if(!n)return[];
  const pool=D.customers.filter(c=>c.type!=='expense'&&c.type!=='sales');
  let out=pool.filter(c=>norm(c.name)===n);
  const w=n.split(' ');
  if(w.length===1){const k=skel(w[0]);out=pool.filter(c=>{const f=words(c.name)[0];return norm(c.name)===n||(f&&k&&skel(f)===k);});}
  if(raw&&out.length>1){const s=' '+norm(raw)+' ';const full=out.filter(c=>norm(c.name).split(' ').length>1&&s.includes(' '+norm(c.name)+' '));if(full.length)out=full;}
  return out;
}
