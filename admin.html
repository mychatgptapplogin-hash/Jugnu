<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Jugnu Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F4;--surface:#FFFFFF;--ink:#0F1D18;--ink2:#46574F;--line:#DCE5E0;
  --brand:#0E7A5B;--brand-d:#08503C;--brand-soft:#E2F3EB;--accent:#F2A516;--accent-soft:#FFF3D6;
  --bad:#B42318;--bad-soft:#FDECEA;--good:#0E7A5B;
  --r:16px;--sh:0 1px 2px rgba(15,29,24,.06),0 8px 24px rgba(15,29,24,.07);
  --f:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;padding:0 16px 48px}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding:18px 0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-d));display:grid;place-items:center;box-shadow:var(--sh)}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px 5px rgba(242,165,22,.55)}
h1{font-size:20px;margin:0;letter-spacing:-.02em}
header small{display:block;color:var(--ink2);font-size:13px}
.sp{flex:1}
.btn{border:none;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:600;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.login{max-width:400px;margin:8vh auto 0}
label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.6}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;margin-top:10px;font-size:14px}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:14px;overflow-x:auto}
.tabs button{border:none;background:none;font:inherit;font-weight:600;color:var(--ink2);padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;min-height:40px}
.tabs button[aria-selected="true"]{background:var(--brand);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi small{color:var(--ink2);font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.kpi b{display:block;font-size:28px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi span{font-size:12px;color:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tblw{overflow-x:auto;margin:0 -18px;padding:0 18px}
.tbl th{text-align:start;font-size:12px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{text-align:end;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:none}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand-d)}
.pill.warm{background:var(--accent-soft);color:#7A4E00}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:#EEF2F0;color:var(--ink2)}
.muted{color:var(--ink2);font-size:13px}
.fb{border-bottom:1px solid var(--line);padding:12px 0}
.fb:last-child{border-bottom:none}
.fb p{margin:6px 0 0;white-space:pre-wrap}
.fb .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brain-item{border-bottom:1px solid var(--line);padding:14px 0}
.brain-item:last-child{border-bottom:none}
.brain-item h3{font-size:15px;margin:0}
.brain-item .muted{margin:2px 0 6px}
.ur{font-family:'Noto Nastaliq Urdu',var(--f);direction:rtl;line-height:2}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px;z-index:9}
.bar{height:8px;border-radius:4px;background:var(--brand-soft);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--brand)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 14px}
select,input[type=file]{width:100%}
.empty{text-align:center;color:var(--ink2);padding:24px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>

function tabs(){const T=[['overview','Overview'],['testers','Testers ('+DATA.testers.length+')'],['feedback','Feedback ('+DATA.feedback.filter(x=>x.status==='new').length+' new)'],['brain',"Jugnu's brain"],['library','Library ('+LIBDOCS.length+')']];

function overview(){const T=DATA.testers,wk=Date.now()-7*86400000;
  const active=T.filter(x=>Date.parse(x.last_seen)>wk).length,daily=T.filter(x=>x.days_active_7d>=4).length;

   <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">

   </div>`;}

async function pdfPages(file){await loadJS('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

function chunkPages(pages){const out=[];let idx=0;const MAX=1500,OV=200;
  for(const p of pages){const t=(p.text||'').replace(/\n{3,}/g,'\n\n').trim();if(t.length<20)continue;
    for(let i=0;i<t.length;i+=MAX-OV){let piece=t.slice(i,i+MAX);if(i+MAX<t.length){const cut=Math.max(piece.lastIndexOf('. '),piece.lastIndexOf('۔'),piece.lastIndexOf('\n'));if(cut>MAX*0.6)piece=piece.slice(0,cut+1);}
      out.push({idx:idx++,page:p.page,content:piece.trim()});if(i+MAX>=t.length)break;}}
  return out;}
let LIBDOCS=[],LIBMSG='';
const LIBP=m=>{LIBMSG=m;const e=$('libProg');if(e)e.textContent=m;};
async function loadLib(){try{LIBDOCS=await api('library_docs?select=*&order=created_at.desc&limit=500')||[];}catch(e){LIBDOCS=[];}}
function library(){const by={};LIBDOCS.forEach(d=>{const k=lbName('board',d.board)+' · '+lbName('cls',d.cls);(by[k]=by[k]||[]).push(d);});
  return `<div class="card"><h3 style="margin:0 0 6px;font-size:16px">Add material</h3><p class="muted" style="margin-top:0">Upload a text PDF, Word file or text file, or paste text. Ustad will answer from it for students of the matching board, class, subject and school, and will name it as the source. Use official material (KP Textbook Board, BISE, FBISE) or material you have permission to use.</p>
   <form id="libF"><div class="g2">
    <div><label for="lT">Title</label><input id="lT" required maxlength="200" placeholder="KPTBB Physics Class 9 (English medium)"></div>
    <div><label for="lK">Type</label><select id="lK">${opts('kind','textbook')}</select></div>
    <div><label for="lB">Board / syllabus</label><select id="lB">${opts('board','kp')}</select></div>
    <div><label for="lS">School (only for one school's own material)</label><input id="lS" maxlength="80" placeholder="Leave empty for everyone"></div>
    <div><label for="lC">Class</label><select id="lC">${opts('cls','9')}</select></div>
    <div><label for="lSu">Subject</label><select id="lSu">${opts('subject','physics')}</select></div>
    <div><label for="lM">Medium</label><select id="lM">${opts('medium','any')}</select></div>
    <div><label for="lY">Year (papers)</label><input id="lY" inputmode="numeric" maxlength="4" placeholder="2024"></div>
    <div style="grid-column:1/-1"><label for="lSrc">Source (website or who gave it)</label><input id="lSrc" maxlength="300" placeholder="https://kpese.gov.pk/textbook-board-tbb/"></div>
    <div style="grid-column:1/-1"><label for="lFile">File (PDF, DOCX or TXT, up to 50 MB)</label><input id="lFile" type="file" accept=".pdf,.docx,.txt,application/pdf,text/plain"></div>
    <div style="grid-column:1/-1"><label for="lTxt">Or paste text</label><textarea id="lTxt" dir="auto" placeholder="Paste chapter text, notes or a past paper here"></textarea></div></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="libGo">Add to library</button><span class="muted" id="libProg" role="status">${esc(LIBMSG)}</span></div></form></div>
  <div class="card"><h3 style="margin:0 0 6px;font-size:16px">Test what Ustad finds</h3><div class="row"><select id="tB" style="width:auto">${opts('board','kp')}</select><select id="tC" style="width:auto">${opts('cls','9')}</select><select id="tSu" style="width:auto">${opts('subject','any')}</select><input id="tQ" style="flex:1;min-width:180px" placeholder="Question, e.g. Newton's second law"><button class="btn ghost sm" id="tGo">Search</button></div><div id="tRes"></div></div>
  <div class="card"><h3 style="margin:0 0 6px;font-size:16px">In the library (${LIBDOCS.length})</h3>${LIBDOCS.length?Object.entries(by).map(([k,ds])=>`<h4 style="margin:14px 0 4px">${esc(k)}</h4><div class="tblw"><table class="tbl"><thead><tr><th>Title</th><th>Subject</th><th>Type</th><th>School</th><th class="n">Passages</th><th>Added</th><th>Status</th><th></th></tr></thead><tbody>${ds.map(d=>`<tr><td><b dir="auto">${esc(d.title)}</b>${d.source?`<div class="muted" style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.source)}</div>`:''}</td><td>${esc(lbName('subject',d.subject))}</td><td>${esc(lbName('kind',d.kind))}${d.year?' '+d.year:''}</td><td>${esc(d.school||'All')}</td><td class="n">${d.chunks}</td><td style="white-space:nowrap">${esc(ago(d.created_at))}</td><td>${d.active?'<span class="pill">Live</span>':'<span class="pill mute">Hidden</span>'}</td><td style="white-space:nowrap"><button class="btn ghost sm" data-lact="${d.id}" data-on="${d.active?0:1}">${d.active?'Hide':'Show'}</button> <button class="btn ghost sm" data-ldel="${d.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`).join(''):'<p class="muted">Nothing yet. Start with the KP Textbook Board books students use most: Class 9 and 10 Physics, Chemistry, Biology and Maths.</p>'}</div>`;}
async function libAdd(e){e.preventDefault();const btn=$('libGo');const f=$('lFile').files[0];const pasted=$('lTxt').value.trim();const title=$('lT').value.trim();
  if(!title)return toast('Add a title');if(!f&&pasted.length<50)return toast('Choose a file or paste at least a paragraph');
  btn.disabled=true;try{let pages=[];
    if(f){if(f.size>52428800)throw new Error('File is over 50 MB');const ext=(f.name.split('.').pop()||'').toLowerCase();
      if(ext==='pdf')pages=await pdfPages(f);else if(ext==='docx')pages=await docxPages(f);else pages=[{page:null,text:await f.text()}];}
    if(pasted)pages.push({page:null,text:pasted});
    const chunks=chunkPages(pages);const chars=chunks.reduce((s,c)=>s+c.content.length,0);
    if(!chunks.length)throw new Error('No readable text found. This looks like a scanned PDF (pictures of pages). Use a text PDF or paste the text.');
    LIBP('Saving…');const yr=parseInt($('lY').value,10);
    const doc=(await api('library_docs',{method:'POST',body:{title,board:$('lB').value,school:$('lS').value.trim()||null,cls:$('lC').value,subject:$('lSu').value,medium:$('lM').value,kind:$('lK').value,year:yr>1900&&yr<2100?yr:null,source:$('lSrc').value.trim()||null,chars,chunks:chunks.length},prefer:'return=representation'}))[0];
    if(f){LIBP('Uploading original file…');const path=doc.id+'/'+f.name.replace(/[^\w.\-]+/g,'_');const t=await token();
      const r=await fetch(SB_URL+'/storage/v1/object/library/'+path,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+t,'content-type':f.type||'application/octet-stream','x-upsert':'true'},body:f});
      if(r.ok)await api('library_docs?id=eq.'+doc.id,{method:'PATCH',body:{storage_path:path},prefer:'return=minimal'});}
    for(let i=0;i<chunks.length;i+=100){LIBP(`Saving passages ${i+1} to ${Math.min(i+100,chunks.length)} of ${chunks.length}…`);await api('library_chunks',{method:'POST',body:chunks.slice(i,i+100).map(c=>Object.assign({doc_id:doc.id},c)),prefer:'return=minimal'});}
    LIBP('');toast(`Added: ${chunks.length} passages. Live for students now.`);await loadLib();render();
  }catch(err){LIBP('');toast(err.message||'Could not add');btn.disabled=false;}}
function bindLib(){const f=$('libF');if(!f)return;f.onsubmit=libAdd;
  $('tGo').onclick=async()=>{const el=$('tRes');el.innerHTML='<p class="muted">Searching…</p>';try{const q=$('tQ').value.split(/\s+/).filter(w=>w.length>=3).join(' ');const rows=await api('rpc/lib_search',{method:'POST',body:{q,p_board:$('tB').value,p_cls:$('tC').value,p_subject:$('tSu').value,p_school:null,n:5}});
    el.innerHTML=rows&&rows.length?rows.map(x=>`<div class="fb"><div class="meta"><b dir="auto">${esc(x.title)}</b><span class="muted">${x.page?'page '+x.page:''}</span></div><p dir="auto" style="white-space:pre-wrap">${esc(String(x.content).slice(0,500))}${x.content.length>500?' …':''}</p></div>`).join(''):'<p class="muted">Nothing found. Ustad will answer from general knowledge for this.</p>';}catch(e){el.innerHTML='<p class="err">Search failed.</p>';}};
  document.querySelectorAll('[data-lact]').forEach(b=>b.onclick=async()=>{try{await api('library_docs?id=eq.'+b.dataset.lact,{method:'PATCH',body:{active:b.dataset.on==='1'},prefer:'return=minimal'});await loadLib();render();}catch(e){toast('Could not update');}});
  document.querySelectorAll('[data-ldel]').forEach(b=>b.onclick=async()=>{const d=LIBDOCS.find(x=>x.id===b.dataset.ldel);if(!d||!confirm('Delete "'+d.title+'" from the library? Students will stop getting answers from it.'))return;
    try{if(d.storage_path){const t=await token();await fetch(SB_URL+'/storage/v1/object/library/'+d.storage_path,{method:'DELETE',headers:{apikey:SB_KEY,Authorization:'Bearer '+t}});}await api('library_docs?id=eq.'+d.id,{method:'DELETE',prefer:'return=minimal'});await loadLib();render();toast('Deleted');}catch(e){toast('Could not delete');}});}
$('outBtn').onclick=()=>{A=null;saveA();loginView();};
boot();
